spring.application.name=backend
server.port=${BACKEND_PORT:8080}
# Cargar variables de entorno desde .env
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# Configuración de la conexión a MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:academia_db}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Configuración JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=60

# Documentación OpenAPI / Swagger UI
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/docs.json

# Origen permitido para el cliente web
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
